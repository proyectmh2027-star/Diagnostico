<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B6E5F">
  <title>Formularios de diagnóstico</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/estilos.css">
  <style>
    .qrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-top: 24px; }
    .tarjeta { border: 1.5px solid var(--linea); border-radius: 12px; padding: 22px; }
    .tarjeta h2 { margin: 0 0 4px; }
    .tarjeta p { margin: 0 0 16px; color: var(--tenue); font-size: 16px; }
    .codigo { background: #fff; padding: 12px; display: inline-block; }
    .codigo img, .codigo canvas { width: 220px !important; height: 220px !important; display: block; }
    .url { font-size: 15px; color: var(--tenue); word-break: break-all; margin-top: 12px; }
    .ir { display: flex; margin-top: 18px; text-decoration: none; place-items: center; justify-content: center; align-items: center; }
    .acciones { margin-top: 28px; }
    .acciones .btn { padding: 0 22px; flex: none; }
    @media print { .acciones, .sub, .ir { display: none; } .tarjeta { break-inside: avoid; border-color: #000; } main { padding-bottom: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>Formularios de diagnóstico</h1>
    <p class="sub">Escanea el código del formulario que vas a aplicar, o tócalo si ya estás en el teléfono.</p>
    <div class="qrs">
      <section class="tarjeta">
        <h2>A · Familia</h2>
        <p>Necesidades del hogar, una persona por vivienda.</p>
        <div class="codigo" id="qrFamilia"></div>
        <div class="url" id="urlFamilia"></div>
        <a class="btn ir" href="familia/">Abrir Familia</a>
      </section>
      <section class="tarjeta">
        <h2>B · Colonia</h2>
        <p>Necesidades de la colonia, vecinos y líderes.</p>
        <div class="codigo" id="qrColonia"></div>
        <div class="url" id="urlColonia"></div>
        <a class="btn ir" href="colonia/">Abrir Colonia</a>
      </section>
    </div>
    <div class="acciones"><button type="button" class="btn sec" onclick="window.print()">Imprimir QR</button></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    var base = location.href.split(/[?#]/)[0].replace(/index\.html$/, '');
    [['familia', 'Familia'], ['colonia', 'Colonia']].forEach(function (x) {
      var url = base + x[0] + '/';
      document.getElementById('url' + x[1]).textContent = url.replace(/^https?:\/\//, '');
      if (window.QRCode) new QRCode(document.getElementById('qr' + x[1]),
        { text: url, width: 440, height: 440, colorDark: '#1D2B3A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
</body>
</html>
